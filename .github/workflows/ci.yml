name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install radicale
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  scripts:
    # The backup and setup shell scripts: style checks, then backup and restore against a throwaway Docker volume.
    # The root-only checks (folder ownership, a full disk) use the runner's passwordless sudo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # openssh-server: the ssh settings test checks them with the real sshd -t.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck rsync openssh-server
      - run: shellcheck scripts/*.sh scripts/mac/*.sh scripts/tests/*.sh
      - run: bash scripts/tests/run.sh

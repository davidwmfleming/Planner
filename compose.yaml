# The planner and its calendar server. All data lives in the one "data" volume (caught by the nightly backup).
# Settings come from .env next to this file; scripts/server-setup.sh writes it.
name: planner

services:
  radicale:
    build: docker/radicale
    restart: unless-stopped
    # Nothing in it needs special permissions.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Reachable only by the planner (and the sample seeder), never by the share container.
    networks: [calendar]
    environment:
      CALDAV_USER: ${CALDAV_USER:-david}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:?Set CALDAV_PASSWORD in .env}
    volumes:
      - data:/data

  planner:
    build: .
    restart: unless-stopped
    depends_on: [radicale]
    # Nothing in it needs special permissions.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [default, calendar]
    environment:
      CALDAV_URL: http://radicale:5232/
      CALDAV_USER: ${CALDAV_USER:-david}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:?Set CALDAV_PASSWORD in .env}
      ORIGIN: ${ORIGIN:?Set ORIGIN in .env to the planner's https address}
      TZ: ${TZ:-America/Halifax}
      # The public address of shared calendar links (the share service below); empty turns sharing off.
      FEED_ORIGIN: ${FEED_ORIGIN:-}
      # The Tailscale logins that may use the planner (comma-separated); server-setup.sh writes yours. Empty lets
      # in anyone who can reach the server over Tailscale.
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      # Used once, the first time the planner starts, to fill in its settings.
      WORK_CALENDAR: ${WORK_CALENDAR:-Work}
      EVENTS_CALENDAR: ${EVENTS_CALENDAR:-Me}
    # Only this machine can reach it; Tailscale Serve gives it the https address.
    ports:
      - 127.0.0.1:${PLANNER_PORT:-3000}:3000

  # Shared calendar links: a Tailscale machine of its own (planner-share) that publishes only /feed to the internet
  # with Funnel, so the server's own name and ports stay tailnet-only. On when .env sets COMPOSE_PROFILES=share
  # (server-setup.sh does, once SHARE_AUTHKEY is in .env). See "Shared calendar links" in docs/design.md.
  share:
    image: tailscale/tailscale:v1.104.2
    profiles: [share]
    restart: unless-stopped
    depends_on: [planner]
    hostname: planner-share
    # Userspace mode needs no special permissions.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Only the planner, not the calendar server (on the default network, which also reaches the internet).
    environment:
      TS_AUTHKEY: ${SHARE_AUTHKEY:-}
      TS_HOSTNAME: planner-share
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"  # sign in with the key only the first time; later starts use the saved identity
      # A tagged machine: no access to the rest of the tailnet (see the README) and no key expiry.
      TS_EXTRA_ARGS: --advertise-tags=tag:planner-share
    volumes:
      - share-state:/var/lib/tailscale
      - ./docker/share/serve.json:/config/serve.json:ro

  # Sample entries for a test machine: docker compose --profile sample run --rm seed
  seed:
    build:
      context: .
      target: seed
    profiles: [sample]
    depends_on: [radicale]
    networks: [calendar]
    environment:
      CALDAV_URL: http://radicale:5232/
      CALDAV_USER: ${CALDAV_USER:-david}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:?Set CALDAV_PASSWORD in .env}

networks:
  # The calendar server's own network: no way out to the internet, and no share container.
  calendar:
    internal: true

volumes:
  data:
  # Only planner-share's Tailscale identity, no calendar data, so it is left out of the backup: if it is lost,
  # a new auth key brings it back (remove the old planner-share machine in the Tailscale admin console first, so
  # the name, and so the links, stay the same).
  share-state:
